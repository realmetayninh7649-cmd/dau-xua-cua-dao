<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#205448">
  <title>Ngoại tuyến – Giữ Đạo Giữa Đời</title>
  <style>
    :root{color-scheme:light}
    *{box-sizing:border-box}
    body{margin:0;background:#f8f5ed;color:#21483e;font-family:system-ui,-apple-system,sans-serif;min-height:100dvh;display:grid;place-items:center;padding:28px}
    main{width:min(100%,420px);text-align:center;background:#fffdf8;padding:32px 22px;border:1px solid #d9d5c8;border-radius:18px}
    img{height:74px;width:74px;object-fit:contain}
    h1{font-size:22px;margin:16px 0 10px}
    p{line-height:1.7;color:#5d7168;font-size:15px}
    a{display:inline-block;background:#205448;color:white;text-decoration:none;border-radius:8px;padding:13px 20px;margin-top:8px}
  </style>
</head>
<body>
  <main>
    <img src="./logo.png" alt="Giữ Đạo Giữa Đời">
    <h1>Hiện chưa có kết nối Internet</h1>
    <p>Kho tư liệu cần kết nối mạng để tải bài viết và hình ảnh mới từ hệ thống. Xin kiểm tra Wi-Fi hoặc dữ liệu di động rồi thử lại.</p>
    <a href="./">Thử kết nối lại</a>
  </main>
</body>
</html>
