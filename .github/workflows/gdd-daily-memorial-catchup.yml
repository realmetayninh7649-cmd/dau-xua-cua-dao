name: GDD - Publish today's calendar memorial catchup
on:
  push:
    branches: [cloudflare-d1-migration-20261123]
    paths: ['scripts/gdd-daily-memorial-catchup.mjs','.github/workflows/gdd-daily-memorial-catchup.yml','workers/gdd-d1-admin/src/daily-memorial.mjs']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gdd-daily-memorial-catchup
  cancel-in-progress: false
jobs:
  publish-today:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check scripts/gdd-daily-memorial-catchup.mjs && node --check workers/gdd-d1-admin/src/daily-memorial.mjs
      - name: Insert only missing notices dated today; never edit existing articles
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/gdd-daily-memorial-catchup.mjs
