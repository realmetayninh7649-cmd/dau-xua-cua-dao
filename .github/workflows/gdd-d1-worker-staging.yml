name: "GDD D1 - Trien khai Worker thu nghiem CHI DOC"
on:
  push:
    branches: [cloudflare-d1-migration-20261123]
    paths:
      - ".github/workflows/gdd-d1-worker-staging.yml"
      - "workers/gdd-d1/wrangler.jsonc"
      - "workers/gdd-d1/src/worker.mjs"
      - "tests/d1-public-restored.test.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  staging:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: "An toan truoc khi xuat ban thu nghiem"
        run: |
          set -euo pipefail
          node --check workers/gdd-d1/src/worker.mjs
          python3 - <<'PY'
          import json,pathlib
          root=pathlib.Path('workers/gdd-d1')
          cfg=json.loads((root/'wrangler.jsonc').read_text())
          assert cfg['name']=='gdd-d1-api-staging'
          assert cfg['workers_dev'] is True
          assert cfg['d1_databases'][0]['binding']=='DB'
          assert cfg['d1_databases'][0]['database_id']=='56bf9fcc-3f9a-43e5-82f7-8c521f5b370a'
          assert cfg['d1_databases'][0]['database_name']=='gdd-dao-su-editor-live-clone-20261124'
          assert not cfg.get('r2_buckets')
          assert cfg.get('preview_urls') is False
          js=(root/'src/worker.mjs').read_text()
          assert "if(request.method!=='GET')" in js
          assert "WHERE published=1" in js
          assert 'INSERT INTO' not in js and 'DELETE FROM' not in js
          assert 'WHERE published=1' in js
          print('READ_ONLY_WORKER_CODE_APPROVED=True')
          PY
      - name: "Unit test chi xuat ban du lieu cong khai tu D1 phuc hoi"
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/d1-public-restored.test.mjs
          echo "D1_PUBLISHED_DRAFT_ISOLATION=PASS"
      - name: "Chi deploy Worker staging rieng khong sua R2"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_WORKER_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CI: "true"
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          npx --yes wrangler@4.159.0 deploy --config workers/gdd-d1/wrangler.jsonc
      - name: "Smoke test GET public va chan toan bo ghi"
        run: |
          python3 - <<'PY'
          import json,time,urllib.request,urllib.error
          base='https://gdd-d1-api-staging.realmetayninh7649.workers.dev'
          last_error='no_response'
          headers={'User-Agent':'GDD-D1-Staging-Health/1.0','Accept':'application/json'}
          for n in range(12):
              try:
                  request=urllib.request.Request(base+'/health',headers=headers)
                  with urllib.request.urlopen(request,timeout=15) as response:
                      check=json.load(response)
                  if check.get('status')=='ok':
                      print('D1_STAGING_HEALTH=OK')
                      break
                  last_error='unexpected_status:'+str(check.get('status'))
              except urllib.error.HTTPError as exc:
                  last_error='HTTP_'+str(exc.code)
              except Exception as exc:
                  last_error=type(exc).__name__+':'+str(exc)[:140]
              if n in (0,3,7,11):
                  print('D1_HEALTH_ATTEMPT='+str(n+1)+' '+last_error)
              time.sleep(3)
          else:raise SystemExit('Staging Worker health check failed: '+last_error)
          with urllib.request.urlopen(urllib.request.Request(base+'/api/v1/public/people?limit=5&offset=0',headers=headers),timeout=20) as response:
              obj=json.load(response)
          rows=obj.get('data') or []
          if len(rows)!=5 or not all(r.get('published') is True for r in rows):
              raise SystemExit('Published people API failed')
          with urllib.request.urlopen(urllib.request.Request(base+'/api/v1/public/posts?limit=3',headers=headers),timeout=20) as response:
              posts=json.load(response).get('data') or []
          if len(posts)!=3 or not all(r.get('published') is True for r in posts):
              raise SystemExit('Published posts API failed')
          for url,method,expected in [
              ('/api/v1/admin/session','GET',403),
              ('/api/v1/public/admin_users','GET',404),
              ('/api/v1/public/people','POST',405)
          ]:
              request=urllib.request.Request(base+url,method=method,headers=headers)
              try:
                  urllib.request.urlopen(request,timeout=20)
              except urllib.error.HTTPError as exc:
                  if exc.code!=expected:raise SystemExit('API guard unexpected '+str(exc.code))
              else:raise SystemExit('API guard allowed '+method+' '+url)
          # Full restored D1 has unpublished records: only the approved 50/52 people
          # and 17 published posts must be visible through public endpoints.
          with urllib.request.urlopen(urllib.request.Request(base+'/api/v1/public/people?limit=100',headers=headers),timeout=20) as response:
              visible_people=json.load(response).get('data') or []
          if len(visible_people)!=50 or any(p.get('published') is not True for p in visible_people):
              raise SystemExit('Draft leak or unexpected published people count')
          with urllib.request.urlopen(urllib.request.Request(base+'/api/v1/public/posts?limit=100',headers=headers),timeout=20) as response:
              visible_posts=json.load(response).get('data') or []
          if len(visible_posts)!=17 or any(p.get('published') is not True for p in visible_posts):
              raise SystemExit('Published post count mismatch')
          print('PUBLISHED_PEOPLE_50_DRAFTS_HIDDEN=TRUE')
          print('PUBLISHED_POSTS_17=TRUE')
          for kind,expected in [('gallery',615),('placements',8)]:
              all_rows=[]
              for offset in range(0,1100,100):
                  url=base+'/api/v1/public/'+kind+'?limit=100&offset='+str(offset)
                  with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=25) as response:
                      batch=json.load(response).get('data')
                  if not isinstance(batch,list) or len(batch)>100:
                      raise SystemExit('Invalid '+kind+' public pagination')
                  all_rows.extend(batch)
                  if len(batch)<100:break
              else:raise SystemExit('Public '+kind+' pagination truncated')
              if len(all_rows)!=expected:
                  raise SystemExit('Published-only '+kind+' count mismatch')
              print('PUBLIC_'+kind.upper()+'_COUNT='+str(len(all_rows)))
          print('PUBLIC_READ_ONLY_API_OK=True')
          print('ADMIN_AND_WRITES_DENIED=True')
          print('SUPABASE_R2_UNCHANGED=True')
          PY
