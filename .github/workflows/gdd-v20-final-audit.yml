name: "GDD v2.0 - Kiem thu tong the truoc chot phien ban"
on:
  pull_request:
    paths:
      - ".github/workflows/gdd-v20-final-audit.yml"
      - "scripts/dk016_preserve_legacy_pdfs.py"
      - "app.js"
      - "index.html"
      - "gdd-r2-admin.js"
      - "gdd-document-router.js"
      - "gdd-document-export.js"
      - "r2-xem.mjs"
      - "dao-su-albums.js"
      - "image-viewer.js"
      - "gdd-festival-binh-ngo-2026.css"
      - "gdd-festival-binh-ngo-2026.js"
      - "gdd-section-mastheads.css"
      - "gdd-section-mastheads.js"
      - "gdd-content-metrics.css"
      - "gdd-document-folders.css"
      - "gdd-trace.js"
      - "gdd-content-metrics.js"
      - "gdd-memorial.js"
      - "tests/**"
      - "workers/gdd-r2-gateway/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/gdd-v20-final-audit.yml"
      - "scripts/dk016_preserve_legacy_pdfs.py"
      - "app.js"
      - "index.html"
      - "gdd-r2-admin.js"
      - "gdd-document-router.js"
      - "gdd-document-export.js"
      - "r2-xem.mjs"
      - "dao-su-albums.js"
      - "image-viewer.js"
      - "gdd-festival-binh-ngo-2026.css"
      - "gdd-festival-binh-ngo-2026.js"
      - "gdd-section-mastheads.css"
      - "gdd-section-mastheads.js"
      - "gdd-content-metrics.css"
      - "gdd-document-folders.css"
      - "gdd-trace.js"
      - "gdd-content-metrics.js"
      - "gdd-memorial.js"
      - "tests/**"
      - "workers/gdd-r2-gateway/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: "Kiem tra luong anh, PDF, QR, lich Dao, am thanh tren desktop/iPhone"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: "Kiem tra web nguyen ban trong CI neu website dang bao tri (khong deploy)"
        run: |
          set -euo pipefail
          if grep -q "Website đang tạm bảo trì" index.html; then
            git fetch --no-tags --depth=1 origin refs/heads/backup/pre-maintenance-2026-11-19:refs/remotes/origin/backup/pre-maintenance-2026-11-19
            git show refs/remotes/origin/backup/pre-maintenance-2026-11-19:index.html > index.html
          fi
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          if 'gdd-legacy-r2-images.js' not in s:
              needle='<script defer src="app.js?v=20261119-free-egress-02"></script>'
              if s.count(needle)!=1:raise SystemExit('Expected app.js hook not found in restored webpage')
              s=s.replace(needle, '<script defer src="gdd-legacy-r2-images.js?v=disabled-test"></script>\n'+needle)
          p.write_text(s)
          print('CI homepage replica ready; actual production index remains unchanged')
          PY
      - name: "Kiem tra cu phap JavaScript/Python"
        run: |
          set -eu
          for file in app.js image-viewer.js dao-su-albums.js gdd-r2-admin.js gdd-document-router.js r2-xem.mjs gdd-v2-layout.js gdd-v2-search.js gdd-audio-radio.js gdd-calendar.js; do
            if test -f "$file"; then node --check "$file"; fi
          done
          node --check gdd-document-export.js
          node --check gdd-section-mastheads.js
          node --check gdd-content-metrics.js
          node --check gdd-trace.js
          node --check gdd-phase2-search.js
          node --check dao-su-albums.js
          node --check gdd-image-optimizer.js
          node --check gdd-r2-admin.js
          node --check workers/gdd-r2-gateway/client/uploader.mjs
          node --check gdd-memorial.js
          node --check homepage-previews.js
          node --check gdd-phase2-search.js
          node --check gdd-legacy-r2-images.js
          node --test tests/gdd-r2-legacy-bridge.test.mjs
          node --check gdd-festival-binh-ngo-2026.js
          node --check workers/gdd-r2-gateway/src/index.mjs
          node --check workers/gdd-r2-gateway/client/uploader.mjs
          node --check workers/gdd-r2-gateway/client/document-view.mjs
          python3 -m py_compile scripts/dk016_preserve_legacy_pdfs.py
      - name: "Test nghiep vu va an toan R2"
        run: node --test workers/gdd-r2-gateway/test/*.test.mjs
      - name: "Cai browser smoke runner"
        run: npm install --no-save playwright-core@1.56.1
      - name: "Thu nghiem web tai cho: Desktop va man hinh iPhone"
        run: |
          set -eu
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/gdd-v20-http.log 2>&1 &
          sleep 2
          export CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          node tests/dk013-admin-smoke.mjs
          node tests/dk014-reader-smoke.mjs
          node tests/dk015-unified-reader-smoke.mjs
          node tests/v20-active-site-smoke.mjs
          node tests/image-viewer-gallery-smoke.mjs
          node tests/gdd-festival-2026-smoke.mjs
          node tests/document-export-scope-smoke.mjs
          node tests/section-facebook-metrics-smoke.mjs
          node tests/document-subfolders-smoke.mjs
          node tests/album-upload-batch-smoke.mjs
          node tests/unlimited-document-upload-smoke.mjs
          node tests/photo-trace-smoke.mjs
          node tests/photo-code-lookup-smoke.mjs
      - name: "Luu anh chung cu khi smoke test khong dat"
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gdd-v20-smoke-failures
          path: |
            /tmp/dk*.png
            /tmp/v20-*.png
            /tmp/gdd-gallery-*.png
            /tmp/gdd-festival-*.png
            /tmp/gdd-document-scope-*.png
            /tmp/gdd-document-folders-*.png
            /tmp/gdd-photo-trace-*.png
            /tmp/gdd-photo-lookup-*.png
          if-no-files-found: ignore
