name: "GDD Access - Kiem thu giao dien quan tri moi tren iPhone va may tinh"
on:
  push:
    branches: [cloudflare-d1-migration-20261123]
    paths:
      - "workers/gdd-d1-admin/src/admin-ui.mjs"
      - "tests/gdd-admin-live-layout-smoke.mjs"
      - ".github/workflows/gdd-admin-layout-smoke.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  layout:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: "Static syntax then locally mocked Access editor and R2 dashboard: 390/1280 px"
        run: |
          set -euo pipefail
          npm install --no-save playwright-core@1.56.1
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)" node tests/gdd-admin-live-layout-smoke.mjs
