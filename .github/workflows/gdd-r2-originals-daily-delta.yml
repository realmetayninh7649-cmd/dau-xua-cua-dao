name: "GDD - Daily encrypted R2 originals delta"
on:
  schedule:
    - cron: "45 22 * * *" # 05:45 Asia/Ho_Chi_Minh next day
  push:
    branches: [main]
    paths:
      - "scripts/gdd_r2_daily_delta.py"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gdd-r2-daily-encrypted-delta
  cancel-in-progress: false
jobs:
  backup-delta:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install boto3==1.40.61
      - name: "Export only new private R2 originals, ciphertext only"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          GDD_R2_ARCHIVE_ACCESS_KEY_ID: ${{ secrets.GDD_R2_ARCHIVE_ACCESS_KEY_ID }}
          GDD_R2_ARCHIVE_SECRET_ACCESS_KEY: ${{ secrets.GDD_R2_ARCHIVE_SECRET_ACCESS_KEY }}
        run: python scripts/gdd_r2_daily_delta.py
      - name: "Temporary encrypted transfer artifact; skip if no new original"
        uses: actions/upload-artifact@v4
        with:
          name: gdd-originals-delta-${{ github.run_id }}
          path: /tmp/gdd-daily-encrypted/*.tar.gpg
          if-no-files-found: ignore
          retention-days: 3
          compression-level: 0
