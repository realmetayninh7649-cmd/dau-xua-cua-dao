name: "GDD - Daily encrypted R2 originals delta"
on:
  schedule:
    - cron: "45 22 * * *" # 05:45 Asia/Ho_Chi_Minh next day
  push:
    branches: [main]
    paths:
      - "scripts/gdd_r2_daily_delta.py"
      - ".github/workflows/gdd-r2-originals-daily-delta.yml"
  workflow_dispatch:
    inputs:
      until_utc:
        description: "Optional catch-up end UTC ISO timestamp; does not advance checkpoint"
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: gdd-r2-daily-encrypted-delta
  cancel-in-progress: false
jobs:
  backup-delta:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install boto3==1.40.61
      - name: "Export only new private R2 originals, ciphertext only"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          GDD_R2_ARCHIVE_ACCESS_KEY_ID: ${{ secrets.GDD_R2_BACKUP_READ_ACCESS_KEY_ID || secrets.GDD_R2_ARCHIVE_ACCESS_KEY_ID }}
          GDD_R2_ARCHIVE_SECRET_ACCESS_KEY: ${{ secrets.GDD_R2_BACKUP_READ_SECRET_ACCESS_KEY || secrets.GDD_R2_ARCHIVE_SECRET_ACCESS_KEY }}
          GDD_BACKUP_CONFIRMED_THROUGH_UTC: ${{ vars.GDD_BACKUP_CONFIRMED_THROUGH_UTC }}
          GDD_BACKUP_UNTIL_UTC: ${{ inputs.until_utc }}
        run: python scripts/gdd_r2_daily_delta.py
      - name: "Transfer encrypted part 01, if present"
        uses: actions/upload-artifact@v4
        with:
          name: gdd-originals-delta-${{ github.run_id }}-part-01
          path: /tmp/gdd-daily-encrypted/*-part-01.tar.gpg
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 0
      - name: "Transfer encrypted part 02, if present"
        uses: actions/upload-artifact@v4
        with:
          name: gdd-originals-delta-${{ github.run_id }}-part-02
          path: /tmp/gdd-daily-encrypted/*-part-02.tar.gpg
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 0
      - name: "Transfer encrypted part 03, if present"
        uses: actions/upload-artifact@v4
        with:
          name: gdd-originals-delta-${{ github.run_id }}-part-03
          path: /tmp/gdd-daily-encrypted/*-part-03.tar.gpg
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 0
      - name: "Transfer encrypted part 04, if present"
        uses: actions/upload-artifact@v4
        with:
          name: gdd-originals-delta-${{ github.run_id }}-part-04
          path: /tmp/gdd-daily-encrypted/*-part-04.tar.gpg
