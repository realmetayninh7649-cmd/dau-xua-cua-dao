name: "GDD R2 S3 - one-time read-only connection diagnostic"
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/gdd-r2-s3-readonly-diagnostic.yml"
permissions:
  contents: read
jobs:
  read-only:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install boto3==1.40.61
      - name: "Validate S3 credentials format and list bucket without writes"
        env:
          GDD_R2_ARCHIVE_ACCESS_KEY_ID: ${{ secrets.GDD_R2_ARCHIVE_ACCESS_KEY_ID }}
          GDD_R2_ARCHIVE_SECRET_ACCESS_KEY: ${{ secrets.GDD_R2_ARCHIVE_SECRET_ACCESS_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python - <<'PY'
          import os, re, sys
          import boto3
          from botocore.config import Config
          from botocore.exceptions import ClientError
          access = os.environ.get('GDD_R2_ARCHIVE_ACCESS_KEY_ID','')
          secret = os.environ.get('GDD_R2_ARCHIVE_SECRET_ACCESS_KEY','')
          account = os.environ.get('CLOUDFLARE_ACCOUNT_ID','')
          access_valid = bool(re.fullmatch(r'[0-9a-fA-F]{32}', access))
          secret_present = bool(secret.strip())
          account_valid = bool(re.fullmatch(r'[0-9a-fA-F]{32}', account))
          print(f'S3_ACCESS_ID_32_HEX={access_valid} ACCESS_ID_LENGTH={len(access)}')
          print(f'S3_SECRET_PRESENT={secret_present} ACCOUNT_ID_32_HEX={account_valid}')
          if not (access_valid and secret_present and account_valid):
            print('BLOCKED: one or more secret values have an invalid shape; no S3 request made')
            sys.exit(2)
          s3=boto3.client('s3',endpoint_url=f'https://{account}.r2.cloudflarestorage.com',
            aws_access_key_id=access,aws_secret_access_key=secret,region_name='auto',
            config=Config(signature_version='s3v4',s3={'addressing_style':'path'},
              retries={'max_attempts':1,'mode':'standard'},
              request_checksum_calculation='when_required',
              response_checksum_validation='when_required'))
          try:
            result=s3.list_objects_v2(Bucket='gdd-dau-xua-cua-dao', MaxKeys=1)
            print('R2_LIST_OK=True CONTENTS_RETURNED='+str(len(result.get('Contents',[]))))
          except ClientError as e:
            error=e.response.get('Error',{})
            status=e.response.get('ResponseMetadata',{}).get('HTTPStatusCode','unknown')
            message=str(error.get('Message',''))
            message=re.sub(r'[A-Za-z0-9_-]{24,}','[REDACTED]',message)[:180]
            print(f'R2_LIST_FAILED=True ERROR_CODE={error.get("Code","unknown")} HTTP={status} MESSAGE={message}')
            sys.exit(3)
          PY
