name: "GDD R2 - Repair five already-published memorial portrait previews"
on:
  push:
    branches: [main]
    paths:
      - "maintenance-tasks/r2-fix-memorial-run.flag"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: "Install pinned R2 and WebP tools"
        run: python -m pip install boto3==1.40.61 Pillow==11.3.0
      - name: "Derive verified public portrait WebPs from private R2 original copies only"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          GDD_R2_ARCHIVE_ACCESS_KEY_ID: ${{ secrets.GDD_R2_ARCHIVE_ACCESS_KEY_ID }}
          GDD_R2_ARCHIVE_SECRET_ACCESS_KEY: ${{ secrets.GDD_R2_ARCHIVE_SECRET_ACCESS_KEY }}
        run: |
          python -m py_compile scripts/r2_fix_published_memorial_previews.py
          python scripts/r2_fix_published_memorial_previews.py
