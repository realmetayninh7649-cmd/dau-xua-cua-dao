name: "GDD DK01.3 - Thu nghiem giao dien R2 quan tri"
on:
  pull_request:
    paths:
      - "app.js"
      - "index.html"
      - "gdd-r2-admin.js"
      - "gdd-r2-admin.css"
      - "dao-su-albums.js"
      - "r2-xem.*"
      - "tests/dk014-reader-smoke.mjs"
      - "tests/dk015-unified-reader-smoke.mjs"
      - "gdd-document-router.js"
      - "tests/dk013-admin-smoke.mjs"
      - ".github/workflows/gdd-dk013-admin-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: "Kiem tra R2 Admin tren desktop va iPhone"
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: "Dung trang web nguyen ban de kiem thu, khong mo production"
        run: |
          set -euo pipefail
          if grep -q "Website đang tạm bảo trì" index.html; then
            git fetch --no-tags --depth=1 origin refs/heads/backup/pre-maintenance-2026-11-19:refs/remotes/origin/backup/pre-maintenance-2026-11-19
            git show refs/remotes/origin/backup/pre-maintenance-2026-11-19:index.html > index.html
          fi
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text()
          needle='<script defer src="app.js?v=20261119-free-egress-02"></script>'
          if 'gdd-legacy-r2-images.js' not in s:
              if s.count(needle)!=1: raise SystemExit('Cannot find app.js script hook in original homepage')
              s=s.replace(needle,'<script defer src="gdd-legacy-r2-images.js?v=stage-disabled"></script>\n'+needle)
          p.write_text(s)
          PY
      - name: "Kiem tra cu phap"
        run: |
          node --check app.js
          node --check gdd-r2-admin.js
          node --check tests/dk013-admin-smoke.mjs
          node --check tests/dk014-reader-smoke.mjs
          node --check r2-xem.mjs
          node --check gdd-document-router.js
          node --check tests/dk015-unified-reader-smoke.mjs
          node --check dao-su-albums.js
      - name: "Cai Playwright Core"
        run: npm install --no-save playwright-core@1.56.1
      - name: "Mo giao dien va kiem tra kho R2"
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/gdd-dk013-server.log 2>&1 &
          sleep 2
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)" node tests/dk013-admin-smoke.mjs
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)" node tests/dk014-reader-smoke.mjs
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)" node tests/dk015-unified-reader-smoke.mjs
