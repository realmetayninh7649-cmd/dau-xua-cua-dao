name: "GDD R2 - Live printable PDF privacy smoke"
on:
  push:
    branches: [main]
    paths:
      - "scripts/gdd_r2_public_print_live_audit.py"
      - ".github/workflows/gdd-r2-print-public-audit.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: "No mutation, only public approved R2 derivatives"
        run: python3 scripts/gdd_r2_public_print_live_audit.py
