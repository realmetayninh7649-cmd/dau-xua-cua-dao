name: "GDD - Encrypted temporary archival recovery key transport"
on:
  push:
    branches: [main]
    paths:
      - "maintenance-tasks/gdrive-key-escrow-run.flag"
permissions:
  contents: read
jobs:
  encrypt-key:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install boto3==1.40.61 cryptography==44.0.3
      - name: "Wrap private archival recovery key with temporary external RSA public key; NEVER export plaintext"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          GDD_R2_ARCHIVE_ACCESS_KEY_ID: ${{ secrets.GDD_R2_ARCHIVE_ACCESS_KEY_ID }}
          GDD_R2_ARCHIVE_SECRET_ACCESS_KEY: ${{ secrets.GDD_R2_ARCHIVE_SECRET_ACCESS_KEY }}
        run: |
          python3 - <<'PY'
          import os,re,json,base64,secrets,pathlib
          import boto3
          from botocore.config import Config
          from cryptography.hazmat.primitives import serialization,hashes
          from cryptography.hazmat.primitives.asymmetric import padding
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          aid=os.getenv("CLOUDFLARE_ACCOUNT_ID","")
          access=os.getenv("GDD_R2_ARCHIVE_ACCESS_KEY_ID","")
          secret=os.getenv("GDD_R2_ARCHIVE_SECRET_ACCESS_KEY","")
          if not re.fullmatch(r"[0-9a-fA-F]{32}",aid) or not re.fullmatch(r"[0-9a-fA-F]{32}",access) or len(secret)<12:
              raise SystemExit("Missing bucket-scoped R2 secrets")
          s3=boto3.client("s3",endpoint_url=f"https://{aid}.r2.cloudflarestorage.com",
             aws_access_key_id=access,aws_secret_access_key=secret,region_name="auto",
             config=Config(signature_version="s3v4",s3={"addressing_style":"path"},
                request_checksum_calculation="when_required",response_checksum_validation="when_required"))
          obj=s3.get_object(Bucket="gdd-dau-xua-cua-dao",Key="__gdd_internal__/unlisted-manifest-private-key-v2.asc")
          raw=obj["Body"].read(50000)
          obj["Body"].close()
          if not 1000<len(raw)<45000 or not raw.startswith(b"-----BEGIN PGP PRIVATE KEY BLOCK-----"):
              raise SystemExit("Archive recovery key invalid; nothing published")
          recipient=serialization.load_pem_public_key(pathlib.Path("maintenance-tasks/gdrive-key-escrow-one-time-transport-public.pem").read_bytes())
          akey=AESGCM.generate_key(bit_length=256)
          nonce=secrets.token_bytes(12)
          ct=AESGCM(akey).encrypt(nonce,raw,b"GDD-private-archive-recovery-key-v2")
          wrapped=recipient.encrypt(akey,padding.OAEP(
              mgf=padding.MGF1(algorithm=hashes.SHA256()),algorithm=hashes.SHA256(),label=None))
          pack={"format":"gdd-escrow-aes256gcm-rsa3072-oaep-sha256",
               "key_identifier":"__gdd_internal__/unlisted-manifest-private-key-v2.asc",
               "wrapped_aes_key":base64.b64encode(wrapped).decode(),
               "nonce":base64.b64encode(nonce).decode(),
               "encrypted_private_key":base64.b64encode(ct).decode()}
          path=pathlib.Path("/tmp/gdd-escrow-encrypted");path.mkdir(mode=0o700,exist_ok=True)
          (path/"R2-PRIVATE-RECOVERY-KEY.encrypted.json").write_text(json.dumps(pack))
          print("ENCRYPTED RECOVERY CREDENTIAL READY; plaintext never included in artifact or logs")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: gdd-drive-backup-key-escrow-${{ github.run_id }}
          path: /tmp/gdd-escrow-encrypted/*.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
