name: "GDD R2 - Bao ton anh cong khai va ban xem rieng tu"
on:
  push:
    branches: [main]
    paths:
      - "maintenance-tasks/r2-images-run.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gdd-r2-published-image-private-preservation
  cancel-in-progress: false

jobs:
  check:
    name: "Kiem tra danh muc 700 anh, pham vi va che do bao tri"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m py_compile scripts/r2_preserve_published_images.py
          python scripts/r2_preserve_published_images.py --validate-only

  backup:
    name: "Sao luu byte goc + WebP rieng tu, doi chieu SHA256"
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: "Cai thu vien duoc ghim phien ban"
        run: python -m pip install boto3==1.40.61 Pillow==11.3.0
      - name: "Chi sao luu trong R2 rieng tu - khong sua Supabase"
        env:
          GDD_R2_ARCHIVE_ACCESS_KEY_ID: ${{ secrets.GDD_R2_ARCHIVE_ACCESS_KEY_ID }}
          GDD_R2_ARCHIVE_SECRET_ACCESS_KEY: ${{ secrets.GDD_R2_ARCHIVE_SECRET_ACCESS_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: python scripts/r2_preserve_published_images.py
