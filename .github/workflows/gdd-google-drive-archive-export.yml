name: "GDD - Encrypted R2 backup shard for Google Drive"
on:
  push:
    branches: [main]
    paths:
      - "maintenance-tasks/gdrive-backup-part.json"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gdd-google-drive-original-archive
  cancel-in-progress: false
jobs:
  export-one-encrypted-part:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: "Install pinned read-only R2 dependency"
        run: python -m pip install boto3==1.40.61
      - name: "Verify each R2 original SHA256; encrypt shard before publishing temp artifact"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          GDD_R2_ARCHIVE_ACCESS_KEY_ID: ${{ secrets.GDD_R2_ARCHIVE_ACCESS_KEY_ID }}
          GDD_R2_ARCHIVE_SECRET_ACCESS_KEY: ${{ secrets.GDD_R2_ARCHIVE_SECRET_ACCESS_KEY }}
        run: |
          python -m py_compile scripts/gdrive_export_verified_shard.py
          python scripts/gdrive_export_verified_shard.py
      - name: "Upload only encrypted GPG file as short-lived GitHub Actions artifact"
        uses: actions/upload-artifact@v4
        with:
          name: gdd-drive-backup-${{ github.run_id }}
          path: /tmp/gdd-drive-archive-export/*.tar.gpg
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
