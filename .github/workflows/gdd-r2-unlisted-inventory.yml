name: "GDD R2 - Validate 131 private source images without names"
on:
  pull_request:
    paths:
      - ".github/workflows/gdd-r2-unlisted-inventory.yml"
permissions:
  contents: read
jobs:
  private-inventory:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: "Validate 831 source objects and exactly 131 unlisted private ones; no writes"
        run: |
          python -m py_compile scripts/r2_preserve_unlisted_private_images.py
          python scripts/r2_preserve_unlisted_private_images.py --inventory-only
