name: "GDD Safari/WebKit - Cong khai, Gửi tư liệu, Quan tri iPhone/Laptop"
on:
  push:
    branches: [cloudflare-d1-migration-20261123]
    paths:
      - ".github/workflows/gdd-webkit-live-audit.yml"
      - "tests/gdd-webkit-live-audit.mjs"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  webkit:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: "Use official preinstalled WebKit container (no host browser install)"
        run: npm install --no-save playwright@1.56.1
      - name: "Live production public plus contribution form MOCK (no real submission) and Access admin local mock"
        run: node tests/gdd-webkit-live-audit.mjs
