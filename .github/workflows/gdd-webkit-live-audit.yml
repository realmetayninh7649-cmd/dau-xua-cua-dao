name: "GDD Safari/WebKit - Cong khai, Gửi tư liệu, Quan tri iPhone/Laptop"
on:
  push:
    branches: [cloudflare-d1-migration-20261123]
    paths:
      - ".github/workflows/gdd-webkit-live-audit.yml"
      - "tests/gdd-webkit-live-audit.mjs"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: "Install WebKit browser engine and Linux dependencies"
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps webkit
      - name: "Live production public plus contribution form MOCK (no real submission) and Access admin local mock"
        run: node tests/gdd-webkit-live-audit.mjs
