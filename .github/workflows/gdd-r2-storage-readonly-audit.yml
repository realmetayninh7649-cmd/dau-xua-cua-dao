name: "GDD R2 - Read-only exact storage inventory and Free tier headroom"
on:
  push:
    branches: [main]
    paths:
      - "maintenance-tasks/gdd-r2-storage-audit-trigger.flag"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  count-only:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: "Install pinned read-only S3 library"
        run: python -m pip install boto3==1.40.61
      - name: "Count exact R2 object sizes by private/public function without printing filenames"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          GDD_R2_ARCHIVE_ACCESS_KEY_ID: ${{ secrets.GDD_R2_BACKUP_READ_ACCESS_KEY_ID || secrets.GDD_R2_ARCHIVE_ACCESS_KEY_ID }}
          GDD_R2_ARCHIVE_SECRET_ACCESS_KEY: ${{ secrets.GDD_R2_BACKUP_READ_SECRET_ACCESS_KEY || secrets.GDD_R2_ARCHIVE_SECRET_ACCESS_KEY }}
        run: |
          python - <<'PY'
          import os, re, json, datetime, collections
          import boto3
          from botocore.config import Config
          account=os.environ.get("CLOUDFLARE_ACCOUNT_ID","")
          access=os.environ.get("GDD_R2_ARCHIVE_ACCESS_KEY_ID","")
          secret=os.environ.get("GDD_R2_ARCHIVE_SECRET_ACCESS_KEY","")
          if not re.fullmatch(r"[0-9A-Fa-f]{32}",account) or not re.fullmatch(r"[0-9A-Fa-f]{32}",access) or len(secret)<10:
              raise SystemExit("R2 S3 audit credentials absent; no mutations")
          s3=boto3.client("s3",endpoint_url=f"https://{account}.r2.cloudflarestorage.com",
            aws_access_key_id=access,aws_secret_access_key=secret,region_name="auto",
            config=Config(signature_version="s3v4",s3={"addressing_style":"path"},
              request_checksum_calculation="when_required",response_checksum_validation="when_required"))
          # Bucket-scoped S3 key intentionally cannot enumerate all account buckets.
          bucket="gdd-dau-xua-cua-dao"
          totals=collections.defaultdict(lambda:{"count":0,"bytes":0})
          all_count=all_bytes=0
          token=None
          while True:
              req={"Bucket":bucket,"MaxKeys":1000}
              if token:req["ContinuationToken"]=token
              data=s3.list_objects_v2(**req)
              for obj in data.get("Contents",[]):
                  name=obj["Key"];n=int(obj["Size"])
                  category=name.split("/",1)[0] if "/" in name else "(root)"
                  # The per-prefix totals contain NO filenames, private item paths or source URLs.
                  totals[category]["count"]+=1
                  totals[category]["bytes"]+=n
                  all_count+=1;all_bytes+=n
              if not data.get("IsTruncated"):break
              token=data.get("NextContinuationToken")
              if not token:raise SystemExit("Invalid R2 continuation token")
          if all_count<1500 or all_bytes<1500000000:raise SystemExit("Unexpectedly low R2 inventory; check credentials")
          summary={"audited_at_utc":datetime.datetime.now(datetime.timezone.utc).isoformat(),
            "bucket_scope":"single approved archive bucket","bucket":bucket,
            "object_count":all_count,"bytes":all_bytes,"GB_decimal":round(all_bytes/1e9,4),
            "GiB_binary":round(all_bytes/2**30,4),
            "percent_of_10GB_free_storage":round(all_bytes/1e10*100,2),
            "group_totals":dict(sorted(totals.items()))}
          print("R2_READONLY_STORAGE_AUDIT="+json.dumps(summary,ensure_ascii=False,sort_keys=True))
          print("No files, metadata or publication state changed. No private filenames or credentials printed.")
          PY
