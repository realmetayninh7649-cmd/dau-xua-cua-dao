name: "GDD - Production live audit calendar SEO and contribution privacy"
on:
  push:
    branches: [cloudflare-d1-migration-20261123]
    paths:
      - ".github/workflows/gdd-production-content-audit.yml"
      - "scripts/gdd_production_content_audit.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: "No writes: production calendar/feed/SEO and D1 privacy audit"
        run: python3 scripts/gdd_production_content_audit.py
