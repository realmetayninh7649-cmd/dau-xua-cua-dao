name: Import original Niệm Danh Diêu Trì Kim Mẫu MP3
on:
  push:
    paths:
      - '.github/workflows/import-chant-once.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-audio:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Save and verify original recording
        env:
          AUDIO_SOURCE: 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/3c5a8c0a-ec82-43cd-a5e0-71e71517dc88.mp3?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiMzIyNDE2Njk3MmU3OWI0NyIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5NDMwNDIzM30.WmjtJb_ix7LVx-6AnMYIOTdMfYkA71jdcFmsBulNm90'
        run: |
          set -eu
          mkdir -p audio
          curl --fail --location --retry 3 --silent --show-error "$AUDIO_SOURCE" -o audio/niem-danh-dieu-tri-kim-mau.mp3
          echo 'bf1267a7a00cdfca7afdd8a23cd7a0c3127c9a39889fc4cf42c106fb24a00e66  audio/niem-danh-dieu-tri-kim-mau.mp3' | sha256sum -c -
          test "$(stat -c%s audio/niem-danh-dieu-tri-kim-mau.mp3)" -eq 3254273
      - name: Commit MP3 asset to the published website
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audio/niem-danh-dieu-tri-kim-mau.mp3
          if ! git diff --cached --quiet; then
            git commit -m 'asset: add original Niệm Danh Diêu Trì Kim Mẫu audio'
            git push origin HEAD:main
          fi
