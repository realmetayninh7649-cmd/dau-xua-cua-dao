name: "GDD Access - Gateway quan tri rieng CHI DOC"
on:
  push:
    branches: [cloudflare-d1-migration-20261123]
    paths:
      - ".github/workflows/gdd-access-admin-staging.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-admin-gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: "Check exact Access AUD, hash allowlist and no DB writes"
        shell: bash
        run: |
          set -euo pipefail
          node --check workers/gdd-d1-admin/src/worker.mjs
          python3 - <<'PY'
          import json,pathlib,re
          root=pathlib.Path('workers/gdd-d1-admin')
          config=json.loads((root/'wrangler.jsonc').read_text())
          source=(root/'src/worker.mjs').read_text()
          assert config['name']=='gdd-d1-admin-staging'
          assert config['workers_dev'] is True
          assert config['preview_urls'] is False
          assert 'd1_databases' not in config and 'r2_buckets' not in config
          assert re.fullmatch('[a-f0-9]{64}',config['vars']['ACCESS_AUD'])
          assert re.fullmatch('[a-f0-9]{64}',config['vars']['ADMIN_EMAIL_SHA256'])
          assert 'ctx.access.aud!==env.ACCESS_AUD' in source
          assert 'crypto.subtle.digest' in source
          assert "if(request.method!=='GET')" in source
          print('ADMIN_ACCESS_CONFIG_AUD_AND_HASH=OK')
          print('ADMIN_GATEWAY_NO_DB_NO_R2_NO_MUTATION=TRUE')
          PY
      - name: "Unit-test authenticated runtime identity and negative cases"
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import worker from './workers/gdd-d1-admin/src/worker.mjs';
          import {readFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          const cfg=JSON.parse(readFileSync('workers/gdd-d1-admin/wrangler.jsonc','utf8'));
          const vars=cfg.vars;
          const testEmail='qa-admin@example.invalid';
          const env={...vars, ADMIN_EMAIL_SHA256:createHash('sha256').update(testEmail).digest('hex')};
          const good={access:{aud:vars.ACCESS_AUD, getIdentity:async()=>({email:testEmail})}};
          const wrongEmail={access:{aud:vars.ACCESS_AUD,getIdentity:async()=>({email:'unapproved@example.invalid'})}};
          const wrongAUD={access:{aud:'f'.repeat(64),getIdentity:async()=>({email:testEmail})}};
          async function check(method,path,ctx,values,expected) {
            const req=new Request('https://test.invalid'+path,{method,headers:{'cf-access-jwt-assertion':'untrusted-fake-token'}});
            const res=await worker.fetch(req,values,ctx);
            if(res.status!==expected)throw Error(path+': HTTP '+res.status+' expected '+expected);
            return res.json();
          }
          const allowed=await check('GET','/api/v1/admin/session',good,env,200);
          if(allowed.authenticated!==true||allowed.write_enabled!==false)throw Error('Expected read-only verified admin');
          await check('GET','/api/v1/admin/session',wrongEmail,env,403);
          await check('GET','/api/v1/admin/session',wrongAUD,env,403);
          await check('GET','/api/v1/admin/session',{},env,403);
          await check('GET','/api/v1/admin/session',good,{},403);
          await check('GET','/api/v1/admin/session',{access:{aud:vars.ACCESS_AUD,getIdentity:async()=>{throw Error('Identity failure')}}},env,403);
          await check('POST','/api/v1/admin/session',good,env,405);
          await check('GET','/api/v1/admin/users',good,env,404);
          const health=await check('GET','/health',{},vars,200);
          if(health.access_configured!==true)throw Error('Access config not active');
          console.log('ADMIN_RUNTIME_ACCESS_VERIFIED_AND_LOCKED=PASS');
          NODE
      - name: "Deploy separate admin Worker only"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_WORKER_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CI: "true"
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx --yes wrangler@4.159.0 deploy --config workers/gdd-d1-admin/wrangler.jsonc
      - name: "Verify real Access protection for unauthenticated browser"
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,time
          base='https://gdd-d1-admin-staging.realmetayninh7649.workers.dev'
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,newurl):return None
          op=urllib.request.build_opener(NoRedirect())
          for path in ['/health','/api/v1/admin/session']:
              status=0;redirect=False
              for attempt in range(6):
                  req=urllib.request.Request(base+path,headers={'User-Agent':'GDD-Access-Verification/1.0'})
                  try:
                      with op.open(req,timeout=20) as res:
                          status=res.status;loc=res.headers.get('Location','')
                  except urllib.error.HTTPError as e:
                      status=e.code;loc=e.headers.get('Location','')
                  redirect=status in (301,302,303,307,308) and 'cloudflareaccess.com' in loc.lower()
                  if redirect:break
                  time.sleep(2)
              if not redirect:raise SystemExit('Admin Access not protecting '+path+', status '+str(status))
              print('ACCESS_PROTECTED_'+path.replace('/','_')+'=TRUE')
          print('UNAUTHENTICATED_REQUESTS_BLOCKED=TRUE')
          print('PUBLIC_API_R2_SUPABASE_UNCHANGED=TRUE')
          PY
