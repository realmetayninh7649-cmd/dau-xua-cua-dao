name: "GDD Access - Quan tri D1 thu nghiem CHI DOC"
on:
  push:
    branches: [cloudflare-d1-migration-20261123]
    paths:
      - ".github/workflows/gdd-access-admin-staging.yml"
      - "workers/gdd-d1-admin/src/**"
      - "workers/gdd-d1-admin/wrangler.jsonc"
      - "workers/gdd-d1/source-row-counts-20261123.json"
      - "tests/d1-admin-preview.test.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-admin-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: "An toan: D1 dung database rieng, khong dong R2/Supabase"
        shell: bash
        run: |
          set -euo pipefail
          node --check workers/gdd-d1-admin/src/worker.mjs
          node --check workers/gdd-d1-admin/src/admin-ui.mjs
          python3 - <<'PY'
          import json,pathlib,re
          root=pathlib.Path('workers/gdd-d1-admin')
          cfg=json.loads((root/'wrangler.jsonc').read_text())
          js=(root/'src/worker.mjs').read_text()
          assert cfg['name']=='gdd-d1-admin-staging'
          assert cfg['preview_urls'] is False
          assert cfg['workers_dev'] is True
          assert 'r2_buckets' not in cfg
          assert len(cfg['d1_databases'])==1
          assert cfg['d1_databases'][0]['binding']=='DB'
          assert cfg['d1_databases'][0]['database_name']=='gdd-dao-su-archive'
          assert cfg['d1_databases'][0]['database_id']=='bffcd3e0-e46e-4280-b8dd-82e8d3402b3d'
          assert re.fullmatch('[a-f0-9]{64}',cfg['vars']['ACCESS_AUD'])
          assert re.fullmatch('[a-f0-9]{64}',cfg['vars']['ADMIN_EMAIL_SHA256'])
          assert 'ctx.access.aud!==env.ACCESS_AUD' in js
          assert 'crypto.subtle.digest' in js
          assert "if(request.method!=='GET')" in js
          assert "WHERE published=1" in js
          baseline=json.loads(pathlib.Path('workers/gdd-d1/source-row-counts-20261123.json').read_text())
          assert len(baseline['table_counts'])==21
          assert sum(baseline['table_counts'].values())==1892
          assert baseline['snapshot_date']=='2026-11-23'
          assert js.count('INSERT INTO')==0 and js.count('DELETE FROM')==0
          print('D1_ADMIN_STAGING_ONLY_SELECT=TRUE')
          PY
      - name: "Test Access policies and all read-only management API routes"
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/d1-admin-preview.test.mjs
          echo "D1_ADMIN_UNIT_TESTS=PASS"
      - name: "Deploy ONLY isolated Access-protected admin worker"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_WORKER_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CI: "true"
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx --yes wrangler@4.159.0 deploy --config workers/gdd-d1-admin/wrangler.jsonc
      - name: "Check unauthenticated public requests denied by real Cloudflare Access"
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,time
          base='https://gdd-d1-admin-staging.realmetayninh7649.workers.dev'
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,newurl):return None
          opener=urllib.request.build_opener(NoRedirect())
          for path in ['/','/admin','/admin/app.js','/api/v1/admin/session','/api/v1/admin/summary']:
              status=0
              for attempt in range(6):
                  req=urllib.request.Request(base+path,
                    headers={'User-Agent':'GDD-D1-Admin-Staging-Audit/1.0'})
                  try:
                      with opener.open(req,timeout=20) as response:
                          status=response.status
                          location=response.headers.get('Location','')
                  except urllib.error.HTTPError as e:
                      status=e.code
                      location=e.headers.get('Location','')
                  if status in (301,302,303,307,308) and 'cloudflareaccess.com' in location.lower():break
                  time.sleep(2)
              else:raise SystemExit('Access protection missing on '+path+' HTTP='+str(status))
              print('ACCESS_BLOCKED_UNAUTHENTICATED='+path)
          print('ALL_ADMIN_ROUTES_PROTECTED=TRUE')
          print('WEBSITE_MAIN_R2_SUPABASE_UNCHANGED=TRUE')
          PY
