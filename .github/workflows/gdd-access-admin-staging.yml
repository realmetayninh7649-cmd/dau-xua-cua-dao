name: "GDD Access - Gateway quan tri rieng CHI DOC"
on:
  push:
    branches: [cloudflare-d1-migration-20261123]
    paths:
      - ".github/workflows/gdd-access-admin-staging.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-admin-gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: "Preflight: no writes, no DB, fail closed"
        shell: bash
        run: |
          set -euo pipefail
          node --check workers/gdd-d1-admin/src/worker.mjs
          python3 - <<'PY'
          import json,pathlib
          root=pathlib.Path('workers/gdd-d1-admin')
          config=json.loads((root/'wrangler.jsonc').read_text())
          worker=(root/'src/worker.mjs').read_text()
          assert config['name']=='gdd-d1-admin-staging'
          assert config['workers_dev'] is True
          assert config['preview_urls'] is False
          assert 'd1_databases' not in config
          assert 'r2_buckets' not in config
          assert 'ctx.access.aud!==env.ACCESS_AUD' in worker
          assert 'env.ADMIN_EMAILS' in worker
          assert "if(request.method!=='GET')" in worker
          print('ADMIN_GATEWAY_SAFE_CONFIGURATION=OK')
          PY
      - name: "Deploy only gdd-d1-admin-staging"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_WORKER_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CI: "true"
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx --yes wrangler@4.159.0 deploy --config workers/gdd-d1-admin/wrangler.jsonc
      - name: "Public smoke test before Access is turned on: must deny admin"
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import worker from './workers/gdd-d1-admin/src/worker.mjs';
          async function check(method,path,headers={},expectedStatus){
            const req=new Request('https://test.invalid'+path,{method,headers});
            const res=await worker.fetch(req,{},{}); // no Access binding, no credentials.
            if(res.status!==expectedStatus)throw Error(method+' '+path+': expected '+expectedStatus+', got '+res.status);
            return await res.json();
          }
          const health=await check('GET','/health',{},200);
          if(health.access_configured!==false)throw Error('unconfigured gateway accepted Access config');
          const noAuth=await check('GET','/api/v1/admin/session',{},403);
          if(noAuth.authenticated!==false)throw Error('admin session opened');
          await check('GET','/api/v1/admin/session',{'cf-access-jwt-assertion':'forged'},403);
          await check('POST','/api/v1/admin/session',{},405);
          await check('GET','/api/v1/private/records',{},404);
          console.log('ADMIN_GATEWAY_DEFAULT_DENY=PASS');
          NODE
          python3 - <<'PY'
          import urllib.request,urllib.error,json
          base='https://gdd-d1-admin-staging.realmetayninh7649.workers.dev'
          headers={'User-Agent':'GDD-Admin-Gateway-Test/1.0','Accept':'application/json'}
          def get(path,method='GET'):
              req=urllib.request.Request(base+path,method=method,headers=headers)
              try:
                  with urllib.request.urlopen(req,timeout=20) as res:
                      return res.status,json.load(res)
              except urllib.error.HTTPError as err:
                  # Cloudflare Access may have been enabled already; 403 is expected.
                  return err.code,None
          import time
          for attempt in range(12):
              status,health=get('/health')
              if status==200:break
              print('ADMIN_GATEWAY_HEALTH_RETRY='+str(attempt+1)+',HTTP='+str(status))
              time.sleep(3)
          if status!=200:raise SystemExit('Gateway health unexpected HTTP '+str(status))
          print('ADMIN_GATEWAY_HEALTH_OK=TRUE')
          status,_=get('/api/v1/admin/session')
          if status!=403:raise SystemExit('Admin gateway not fail-closed: HTTP '+str(status))
          status,_=get('/api/v1/admin/session','POST')
          if status!=405:raise SystemExit('Admin gateway accepted POST: HTTP '+str(status))
          print('ADMIN_GATEWAY_LIVE_DENIES_UNAUTHENTICATED=PASS')
          print('PUBLIC_D1_API_AND_R2_NOT_MODIFIED=TRUE')
          PY
