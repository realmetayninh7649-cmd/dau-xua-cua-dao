name: "GDD Access - Quan tri D1/R2 + hop thu rieng tu"
on:
  push:
    branches: [cloudflare-d1-migration-20261123]
    paths:
      - ".github/workflows/gdd-access-admin-staging.yml"
      - "workers/gdd-d1-admin/src/**"
      - "tests/d1-working-code-assignment.test.mjs"
      - "workers/gdd-d1-admin/wrangler.jsonc"
      - "workers/gdd-d1/source-row-counts-20261123.json"
      - "tests/d1-admin-preview.test.mjs"
      - "tests/d1-editor-sandbox.test.mjs"
      - "tests/d1-r2-sandbox.test.mjs"
      - "tests/d1-working-editor.test.mjs"
      - "tests/d1-working-editor-integration.test.mjs"
      - "tests/d1-working-photo-album.test.mjs"
      - "tests/d1-admin-photo-album.test.mjs"
      - "tests/d1-radio-recovery.test.mjs"
      - "tests/d1-audio-upload.test.mjs"
      - "tests/d1-r2-managed.test.mjs"
      - "tests/d1-admin-inbox.test.mjs"
      - "tests/d1-contribution-review.test.mjs"
      - "workers/gdd-r2-gateway/src/index.mjs"
      - "workers/gdd-d1-admin/migrations/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-admin-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: "Bundle exact pinned MP3 encoder and test actual encoding"
        shell: bash
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          npm pack lamejs@1.2.1 --ignore-scripts --pack-destination "$tmp" --registry https://registry.npmjs.org
          tar -xzf "$tmp/lamejs-1.2.1.tgz" -C "$tmp" package/lame.min.js package/LICENSE
          node --input-type=module - "$tmp/package" <<'JS'
          import fs from 'node:fs';
          import vm from 'node:vm';
          const dir=process.argv[2];
          const js=fs.readFileSync(dir+'/lame.min.js','utf8');
          const license=fs.readFileSync(dir+'/LICENSE','utf8');
          const sandbox={console};
          vm.runInNewContext(js,sandbox);
          for(const [ch,rate,kbps] of [[1,32000,64],[2,44100,96],[2,44100,128]]){
            const encoder=new sandbox.lamejs.Mp3Encoder(ch,rate,kbps);
            let size=0;
            for(let i=0;i<rate;i+=1152){
              const pcm=Int16Array.from({length:Math.min(1152,rate-i)},(_,j)=>Math.round(Math.sin((i+j)*2*Math.PI*440/rate)*5000));
              const bytes=ch===2?encoder.encodeBuffer(pcm,pcm):encoder.encodeBuffer(pcm);
              size+=bytes.length;
            }
            size+=encoder.flush().length;
            if(size<kbps*1000/8*.9||size>kbps*1000/8*1.2)throw Error('Unexpected encoder size: '+size);
            console.log('ENCODER_PROFILE_PASS',ch,rate,kbps,size);
          }
          fs.writeFileSync('workers/gdd-d1-admin/src/audio-encoder-vendor.mjs','export const LAME_JS='+JSON.stringify(js)+';\nexport const LAME_LICENSE='+JSON.stringify(license)+';\n');
          JS
      - name: "An toan: D1 lam viec va R2 Access, bao ve hop thu dong gop"
        shell: bash
        run: |
          set -euo pipefail
          node --check workers/gdd-d1-admin/src/worker.mjs
          node --check workers/gdd-d1-admin/src/editor-sandbox.mjs
          node --check workers/gdd-d1-admin/src/r2-sandbox.mjs
          node --check workers/gdd-d1-admin/src/working-editor.mjs
          node --check workers/gdd-d1-admin/src/working-photo-album.mjs
          node --check workers/gdd-d1-admin/src/contribution-review.mjs
          node --check workers/gdd-d1-admin/src/working-codes.mjs
          node --check workers/gdd-d1-admin/src/r2-managed.mjs
          node --check workers/gdd-d1-admin/src/admin-ui.mjs
          node --check workers/gdd-d1-admin/src/photo-album-ui.mjs
          node --check workers/gdd-d1-admin/src/radio-recovery.mjs
          node --check workers/gdd-d1-admin/src/audio-upload.mjs
          node --check workers/gdd-d1-admin/src/audio-optimizer-ui.mjs
          node --check workers/gdd-d1-admin/src/audio-encoder-vendor.mjs
          python3 - <<'PY'
          import json,pathlib,re
          root=pathlib.Path('workers/gdd-d1-admin')
          cfg=json.loads((root/'wrangler.jsonc').read_text())
          js=(root/'src/worker.mjs').read_text()
          assert cfg['name']=='gdd-d1-admin-staging'
          assert cfg['preview_urls'] is False
          assert cfg['workers_dev'] is True
          assert cfg.get('r2_buckets')==[{'binding':'GDD_BUCKET','bucket_name':'gdd-dau-xua-cua-dao'}]
          for banned in ('GDD_BUCKET.put(', 'GDD_BUCKET.delete(', 'GDD_BUCKET.createMultipartUpload(', 'GDD_BUCKET.resumeMultipartUpload('):
              assert banned not in js, banned
          # Private GET for reviewed staff: only a UUID-matched contributions/pending object.
          assert js.count('env.GDD_BUCKET.get(')==1
          recovery=(root/'src/radio-recovery.mjs').read_text()
          assert 'public-audio/radio-hai-muoi-nam-d19ee4f8.mp3' in recovery
          assert "onlyIf:{etagDoesNotMatch:'*'}" in recovery
          assert "await digest(bytes)!==sha" in recovery
          assert 'DELETE FROM' not in recovery and 'GDD_BUCKET.delete(' not in recovery
          assert 'return recoverRadio(request,env,json)' in js
          assert "const prefix='contributions/pending/'+id+'/'" in js
          assert "if(!await isAdministrator(env,ctx))" in js
          assert "attachment; filename=" in js
          assert "if(request.method!=='GET')" in js
          assert 'r2Inventory(env)' in js
          upload=(root/'src/r2-sandbox.mjs').read_text()
          assert "PREFIX='__gdd_internal__/access-staging-uploads-v1/'" in upload
          assert 'MAX_BYTES=2*1024*1024' in upload
          assert 'bucket.delete(' not in upload and 'bucket.get(' not in upload
          assert 'handleR2Sandbox(request,env.GDD_BUCKET)' in js
          assert "handleWorkingEditor(request,env.DB,path)" in js
          assert cfg['vars']['ENABLE_WORKING_EDITOR']=='enabled'
          assert cfg['vars']['ENABLE_MANAGED_R2']=='enabled'
          assert "handleManagedR2(request,env,path)" in js
          assert "handleAlbumPhotos(request,env,path)" in js
          assert "PHOTO_JS" in js
          assert "/admin/photo-album.js" in js
          album=(root/"src/working-photo-album.mjs").read_text()
          assert "preview_not_approved" in album
          assert "archive_gallery_images" in album
          assert "GDD_BUCKET.get(" not in album and "GDD_BUCKET.put(" not in album
          # User-confirmed unlink is limited to a single album association; all archive objects remain.
          unlink_sql="DELETE FROM archive_gallery_images WHERE owner_kind=? AND owner_id=? AND id=? AND image_url=? RETURNING id"
          assert album.count(unlink_sql)==1
          assert "DELETE FROM" not in album.replace(unlink_sql,"")
          assert "GDD_BUCKET.delete(" not in album and "bucket.delete(" not in album
          assert "action==='remove'" in album
          helper=(root/'src/r2-managed.mjs').read_text()
          assert 'indexAsset(env' in helper
          assert 'bucket.delete(' not in helper and 'GDD_BUCKET.delete(' not in helper
          assert 'SUPABASE_URL' not in helper
          gateway=pathlib.Path('workers/gdd-r2-gateway/src/index.mjs').read_text()
          assert 'export async function handleR2AccessApi' in gateway
          assert 'export async function handleR2AccessView' in gateway
          assert cfg['d1_databases'][0]['database_name']=='gdd-dao-su-editor-live-clone-20261124'
          assert cfg['d1_databases'][0]['database_id']=='56bf9fcc-3f9a-43e5-82f7-8c521f5b370a'
          assert "if(env.ENABLE_WORKING_EDITOR!=='enabled')" in js
          working=(root/'src/working-editor.mjs').read_text()
          assert 'gdd_v2_editor_revisions' in working and 'gdd_version=gdd_version+1' in working
          allocator=(root/'src/working-codes.mjs').read_text()
          assert 'archive_code IS NULL' in allocator
          assert 'NOT EXISTS(SELECT 1' in allocator
          assert 'confirmed!==true' in allocator
          assert 'gdd_version=gdd_version+1' in allocator
          assert 'DELETE FROM' not in working
          assert len(cfg['d1_databases'])==2
          assert cfg['d1_databases'][1]=={
              'binding':'EDIT_DB',
              'database_name':'gdd-editor-sandbox-20261124',
              'database_id':'cf3f0c4e-6cdd-4360-b421-03c87717c688'}
          assert cfg['d1_databases'][0]['database_id']!=cfg['d1_databases'][1]['database_id']
          editor=(root/'src/editor-sandbox.mjs').read_text()
          assert 'sandbox_items' in editor and 'sandbox_revisions' in editor
          assert 'env.EDIT_DB' in js and 'handleEditorSandbox(request,env.EDIT_DB,path)' in js
          assert 'handleEditorSandbox(request,env.DB' not in js
          assert 'DELETE FROM' not in editor
          assert cfg['d1_databases'][0]['binding']=='DB'
          assert cfg['d1_databases'][0]['database_name']=='gdd-dao-su-editor-live-clone-20261124'
          assert cfg['d1_databases'][0]['database_id']=='56bf9fcc-3f9a-43e5-82f7-8c521f5b370a'
          assert re.fullmatch('[a-f0-9]{64}',cfg['vars']['ACCESS_AUD'])
          assert re.fullmatch('[a-f0-9]{64}',cfg['vars']['ADMIN_EMAIL_SHA256'])
          assert 'ctx.access.aud!==env.ACCESS_AUD' in js
          assert 'crypto.subtle.digest' in js
          assert "if(request.method!=='GET')" in js
          assert "WHERE published=1" in js
          baseline=json.loads(pathlib.Path('workers/gdd-d1/source-row-counts-20261123.json').read_text())
          assert len(baseline['table_counts'])==21
          assert sum(baseline['table_counts'].values())==1892
          assert baseline['snapshot_date']=='2026-11-23'
          assert js.count('INSERT INTO')==0 and js.count('DELETE FROM')==0
          assert 'row_counts_match_snapshot' in js
          assert 'WHERE published=1' in js
          assert 'publishedCount' in js
          print('D1_ADMIN_STAGING_ONLY_SELECT=TRUE')
          PY
      - name: "Test Access policies and all read-only management API routes"
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/d1-admin-preview.test.mjs tests/d1-editor-sandbox.test.mjs tests/d1-r2-sandbox.test.mjs tests/d1-working-editor.test.mjs tests/d1-r2-managed.test.mjs tests/d1-admin-inbox.test.mjs tests/d1-working-code-assignment.test.mjs tests/d1-contribution-review.test.mjs tests/d1-working-photo-album.test.mjs tests/d1-admin-photo-album.test.mjs tests/d1-radio-recovery.test.mjs tests/d1-audio-upload.test.mjs
          node --test tests/d1-working-editor-integration.test.mjs tests/d1-research.test.mjs
          echo "D1_ADMIN_UNIT_TESTS=PASS"
      - name: "Create reversible editorial trash table in working D1 only"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CI: "true"
        run: |
          npx --yes wrangler@4.159.0 d1 execute gdd-dao-su-editor-live-clone-20261124 --remote --config workers/gdd-d1-admin/wrangler.jsonc --file workers/gdd-d1-admin/migrations/editor-trash.sql
          npx --yes wrangler@4.159.0 d1 execute gdd-dao-su-editor-live-clone-20261124 --remote --config workers/gdd-d1-admin/wrangler.jsonc --file workers/gdd-d1-admin/migrations/editor-cover-slots.sql
          npx --yes wrangler@4.159.0 d1 execute gdd-dao-su-editor-live-clone-20261124 --remote --config workers/gdd-d1-admin/wrangler.jsonc --file workers/gdd-d1-admin/migrations/research-v1.sql
          npx --yes wrangler@4.159.0 d1 execute gdd-dao-su-editor-live-clone-20261124 --remote --config workers/gdd-d1-admin/wrangler.jsonc --file workers/gdd-d1-admin/migrations/research-seed-sources.sql
          npx --yes wrangler@4.159.0 d1 execute gdd-dao-su-editor-live-clone-20261124 --remote --config workers/gdd-d1-admin/wrangler.jsonc --file workers/gdd-d1-admin/migrations/research-seed-excerpts.sql
      - name: "Deploy ONLY isolated Access-protected admin worker"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_WORKER_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CI: "true"
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx --yes wrangler@4.159.0 deploy --config workers/gdd-d1-admin/wrangler.jsonc
      - name: "Check unauthenticated public requests denied by real Cloudflare Access"
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,time
          base='https://gdd-d1-admin-staging.realmetayninh7649.workers.dev'
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,newurl):return None
          opener=urllib.request.build_opener(NoRedirect())
          for path in ['/','/admin','/admin/app.js','/api/v1/admin/session','/api/v1/admin/summary','/api/v1/admin/r2/inventory','/api/v1/admin/r2/staging-uploads','/api/v1/admin/r2/managed/v1/uploads/start','/api/v1/admin/contributions','/api/v1/admin/sandbox','/api/v1/admin/work/people']:
              status=0
              for attempt in range(6):
                  req=urllib.request.Request(base+path,
                    headers={'User-Agent':'GDD-D1-Admin-Staging-Audit/1.0'})
                  try:
                      with opener.open(req,timeout=20) as response:
                          status=response.status
                          location=response.headers.get('Location','')
                  except urllib.error.HTTPError as e:
                      status=e.code
                      location=e.headers.get('Location','')
                  if status in (301,302,303,307,308) and 'cloudflareaccess.com' in location.lower():break
                  time.sleep(2)
              else:raise SystemExit('Access protection missing on '+path+' HTTP='+str(status))
              print('ACCESS_BLOCKED_UNAUTHENTICATED='+path)
          print('ALL_ADMIN_ROUTES_PROTECTED=TRUE')
          print('WEBSITE_MAIN_R2_SUPABASE_UNCHANGED=TRUE')
          PY
