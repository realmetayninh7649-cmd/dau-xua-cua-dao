name: GDD - Verify live record access deployment
on:
  push:
    branches: [cloudflare-d1-migration-20261123]
    paths: ['.github/workflows/gdd-record-access-live-smoke.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify both public enforcement endpoints and existing records
        run: |
          python3 - <<'PY'
          import json,urllib.request,urllib.parse
          api='https://gdd-d1-api-staging.realmetayninh7649.workers.dev/api/v1/public/'
          gate='https://gdd-r2-gateway.realmetayninh7649.workers.dev/'
          def get(url):
              with urllib.request.urlopen(urllib.request.Request(url,headers={'Origin':'https://dauxuacuadao.info.vn','User-Agent':'GDD-live-smoke/1.0'}),timeout=20) as r:
                  return json.load(r)
          assert get(gate+'record-access-ready')['record_access'] is True
          assert get(api+'access-ready')['record_access'] is True
          print('LIVE_ACCESS_ENFORCEMENT_READY=true',flush=True)
          for kind in ['people','documents']:
              rows=get(api+kind+'?limit=5')['data']
              assert rows and all(r['published'] is True for r in rows)
              for row in rows:
                  mode=get(api+'record-access?'+urllib.parse.urlencode({'kind':kind,'slug':row['slug']}))['mode']
                  assert mode in ['download','view','protected']
              print('LIVE_POLICY_READ_OK',kind,len(rows),flush=True)
          print('Existing records and originals unchanged.',flush=True)
          PY
