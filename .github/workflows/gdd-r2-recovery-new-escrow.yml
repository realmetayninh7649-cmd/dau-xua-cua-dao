name: "GDD - Re-wrap archival key to user recovery RSA"
on:
  push:
    branches: [main]
    paths:
      - "maintenance-tasks/gdd-new-recovery-rsa-public-20261119.pem"
permissions:
  contents: read
jobs:
  rewrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install boto3==1.40.61 cryptography==44.0.3
      - name: "Encrypt R2 recovery credential to new RSA public key without exposing plaintext"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          GDD_R2_ARCHIVE_ACCESS_KEY_ID: ${{ secrets.GDD_R2_ARCHIVE_ACCESS_KEY_ID }}
          GDD_R2_ARCHIVE_SECRET_ACCESS_KEY: ${{ secrets.GDD_R2_ARCHIVE_SECRET_ACCESS_KEY }}
        run: |
          import os,re,json,base64,secrets,pathlib
          import boto3
          from botocore.config import Config
          from cryptography.hazmat.primitives import serialization,hashes
          from cryptography.hazmat.primitives.asymmetric import padding
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          aid=os.getenv("CLOUDFLARE_ACCOUNT_ID","")
          access=os.getenv("GDD_R2_ARCHIVE_ACCESS_KEY_ID","")
          secret=os.getenv("GDD_R2_ARCHIVE_SECRET_ACCESS_KEY","")
          if not re.fullmatch(r"[0-9a-fA-F]{32}",aid) or not re.fullmatch(r"[0-9a-fA-F]{32}",access) or len(secret)<12:
              raise SystemExit("Missing R2 read-only credentials")
          s3=boto3.client("s3",endpoint_url=f"https://{aid}.r2.cloudflarestorage.com",
              aws_access_key_id=access,aws_secret_access_key=secret,region_name="auto",
              config=Config(signature_version="s3v4",s3={"addressing_style":"path"},
                  request_checksum_calculation="when_required",response_checksum_validation="when_required"))
          obj=s3.get_object(Bucket="gdd-dau-xua-cua-dao",Key="__gdd_internal__/unlisted-manifest-private-key-v2.asc")
          raw=obj["Body"].read(50000); obj["Body"].close()
          if not 1000<len(raw)<45000 or not raw.startswith(b"-----BEGIN PGP PRIVATE KEY BLOCK-----"):
              raise SystemExit("PGP private key unavailable or invalid")
          rsa_pub=serialization.load_pem_public_key(pathlib.Path("maintenance-tasks/gdd-new-recovery-rsa-public-20261119.pem").read_bytes())
          key=AESGCM.generate_key(bit_length=256)
          nonce=secrets.token_bytes(12)
          encrypted=AESGCM(key).encrypt(nonce,raw,b"GDD-private-archive-recovery-key-v2")
          wrapped=rsa_pub.encrypt(key,padding.OAEP(mgf=padding.MGF1(algorithm=hashes.SHA256()),algorithm=hashes.SHA256(),label=None))
          payload={"format":"gdd-escrow-aes256gcm-rsa3072-oaep-sha256",
          "key_identifier":"__gdd_internal__/unlisted-manifest-private-key-v2.asc",
          "wrapped_aes_key":base64.b64encode(wrapped).decode(),
          "nonce":base64.b64encode(nonce).decode(),
          "encrypted_private_key":base64.b64encode(encrypted).decode()}
          out=pathlib.Path("/tmp/gdd-new-recovery");out.mkdir(parents=True,mode=0o700,exist_ok=True)
          (out/"GDD-R2-PRIVATE-KEY-WRAPPED-20261119.json").write_text(json.dumps(payload))
          print("Success: recovery key re-wrapped to new public RSA key. No plaintext output.")
      - uses: actions/upload-artifact@v4
        with:
          name: gdd-new-recovery-escrow-${{ github.run_id }}
          path: /tmp/gdd-new-recovery/*.json
          if-no-files-found: error
          retention-days: 1
