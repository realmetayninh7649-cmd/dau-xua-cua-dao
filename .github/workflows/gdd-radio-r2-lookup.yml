name: "GDD Radio - Check read-only R2 availability of published originals"
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/gdd-radio-r2-lookup.yml"
      - "scripts/gdd_radio_r2_lookup.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install boto3==1.40.61
      - name: "Read-only inventory metadata, do not access MP3 contents"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          GDD_R2_ARCHIVE_ACCESS_KEY_ID: ${{ secrets.GDD_R2_ARCHIVE_ACCESS_KEY_ID }}
          GDD_R2_ARCHIVE_SECRET_ACCESS_KEY: ${{ secrets.GDD_R2_ARCHIVE_SECRET_ACCESS_KEY }}
        run: python scripts/gdd_radio_r2_lookup.py
