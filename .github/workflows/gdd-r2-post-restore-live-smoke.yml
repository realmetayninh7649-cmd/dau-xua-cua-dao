name: "GDD R2 - Live website restoration final smoke"
on:
  push:
    branches: [main]
    paths:
      - "maintenance-tasks/gdd-post-restore-check-20261119.flag"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  site-live:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - name: "Check live homepage, enabled mapper, 700 publication allowlist, and R2 preview URL"
        run: |
          python3 - <<'PY'
          import json,time,urllib.request,urllib.error
          BASE="https://dauxuacuadao.info.vn"
          WORKER="https://gdd-r2-gateway.realmetayninh7649.workers.dev"
          def get(url,limit=500000,timeout=25):
              req=urllib.request.Request(url,headers={"User-Agent":"GDD-Final-Site-Smoke/1.0","Cache-Control":"no-cache"})
              with urllib.request.urlopen(req,timeout=timeout) as r:
                  data=r.read(limit+1)
                  if len(data)>limit:raise ValueError("Unexpected response size")
                  return r.status,r.headers,data
          for attempt in range(20):
              try:
                  status,headers,body=get(BASE+"/?r2-release-test=20261119",limit=300000)
                  html=body.decode("utf8",errors="replace")
                  if (status==200 and "Website đang tạm bảo trì" not in html and
                      "gdd-legacy-r2-images.js" in html and "app.js" in html and "gdd-image-viewer" in html):
                      print("LIVE HOMEPAGE RESTORED: expected app and R2 bridge present"); break
              except Exception as error:
                  if attempt==19:raise
              time.sleep(6)
          else: raise SystemExit("Public homepage remains in maintenance or missing R2 bridge")
          status,headers,bridge=get(BASE+"/gdd-legacy-r2-images.js?v=20261119-r2-public-01",limit=20000)
          js=bridge.decode("utf8")
          if status!=200 or "const ENABLED=true;" not in js or "legacy-preview" not in js:
              raise SystemExit("Browser-side published R2 mapping not active")
          status,headers,app=get(BASE+"/app.js?v=20261119-free-egress-02",limit=200000)
          if status!=200 or "displayImageUrl" not in app.decode("utf8",errors="replace"):
              raise SystemExit("Browser app is not configured for R2 display URLs")
          manifest=json.load(open("maintenance-tasks/r2-images-published-manifest.json",encoding="utf8"))
          if manifest.get("count")!=700:raise SystemExit("Published allowlist changed")
          path=manifest["objects"][0]["path"]
          status,headers,image=get(WORKER+"/v1/legacy-preview/"+path+".webp",limit=7000000)
          if status!=200 or headers.get("Content-Type")!="image/webp" or image[:4]!=b"RIFF":
              raise SystemExit("Real published R2 WebP is not accessible")
          print("FINAL LIVE SITE PASS: homepage, 700-entry mapping, app and WebP Worker are live")
          PY
